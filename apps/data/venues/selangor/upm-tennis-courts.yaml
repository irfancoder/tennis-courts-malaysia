    - WhatsApp the Unit Fasiliti dan Operasi Sukan with the date and time you want.
    - Download and fill in the facility booking form (Borang Tempahan Fasiliti).
    - Keep the booking form with you. Akademi Sukan staff or UPM security may ask to see it.
  note: >-
    The office answers enquiries during office hours only. Akademi Sukan can cancel bookings
    without notice.
