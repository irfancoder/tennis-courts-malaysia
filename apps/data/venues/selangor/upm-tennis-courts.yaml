booking:
  channels:
    - type: whatsapp
      label: Unit Fasiliti dan Operasi Sukan, Akademi Sukan UPM
      number: +60 3-9769 1282
    - type: portal
      label: Booking form (PDF)
      url: https://drive.google.com/file/d/17ezpPLM0ucIGK_e-En0NEgvhhiVoJWBV/view?usp=drivesdk
