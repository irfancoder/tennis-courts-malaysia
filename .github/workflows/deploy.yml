name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily at 06:00 MYT, so "needs re-checking" flags update without a commit.
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      PUBLIC_IMAGE_TRANSFORMS: ${{ vars.PUBLIC_IMAGE_TRANSFORMS }}
      PUBLIC_UMAMI_SHARE_URL: ${{ vars.PUBLIC_UMAMI_SHARE_URL }}
      PUBLIC_MONETISATION: ${{ vars.PUBLIC_MONETISATION }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm lint && pnpm turbo run typecheck test
      - name: Build data and site
        run: BUILD_DATE=$(date -u +%Y-%m-%d) pnpm turbo run build --force
      - name: Publish parquet views to R2
        run: pnpm --filter @tennis/data upload
      - name: Apply D1 migrations
        working-directory: apps/site
        run: pnpm wrangler d1 migrations apply tennis-submissions --remote
      - name: Deploy Worker
        working-directory: apps/site
        run: pnpm wrangler deploy
